services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reframe
      POSTGRES_PASSWORD: reframe
      POSTGRES_DB: reframe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://reframe:reframe@postgres:5432/reframe
      REDIS_URL: redis://redis:6379/0
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DIR: /storage
    volumes:
      - storage:/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
